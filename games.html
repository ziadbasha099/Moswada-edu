<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Educational Games — Moswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@500;600;700&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="moswada logo home.jpg">
<link rel="apple-touch-icon" sizes="180x180" href="moswada logo home.jpg">

<!-- نفس ملف التصميم الأساسي المستخدم في app.html (الألوان، الخطوط، الأزرار)
     بالإضافة إلى ملف إضافي خاص بهذه الصفحة فقط (بطاقات الألعاب) -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="games.css">
</head>
<body data-theme="light">

<!-- ======================================================================
     GAMES PAGE — only reachable by a signed-in user, same route-guard
     pattern used by settings.html/games.js: starts hidden to avoid a
     flash of empty UI before shared.js confirms who's signed in.
     ====================================================================== -->
<div id="gamesPage" class="hidden">

  <div class="topbar">
    <a class="logo settings-logo" href="app.html">
      <span class="logo-mark" aria-hidden="true">
        <img src="moswada-logo.png" alt="Moswada logo">
      </span>
    </a>
    <div class="topbar-actions">
      <button id="lang-btn" aria-label="Switch language">
        <svg class="lang-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>
        </svg>
        <span class="lang-btn-label">العربية</span>
      </button>
      <a class="btn btn-ghost settings-back-btn" href="app.html" data-en="Back to your links" data-ar="العودة إلى روابطك"></a>
    </div>
  </div>

  <div class="games-shell container">
    <div class="games-heading">
      <h1 data-en="Educational games" data-ar="الألعاب التعليمية"></h1>
      <p data-en="Learn while you play — a small, focused set of games designed to help what you save actually stick." data-ar="تعلّم وأنت تلعب — مجموعة صغيرة ومركّزة من الألعاب صُممت لتساعدك على تثبيت ما تحفظه."></p>
    </div>

    <div class="game-grid" id="gameGrid">

      <!-- ============== لعبة: بطاقات تعليمية (Flashcards) ============== -->
      <div class="game-card" onclick="openFlashcardModal()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFlashcardModal();}">
        <div class="game-card-image">
          <!-- توضيح بصري لبطاقات تعليمية متراكمة، مرسوم كـ SVG داخلي حتى
               يتوافق تلقائياً مع الوضع الفاتح/الداكن دون تحميل صورة خارجية -->
          <svg viewBox="0 0 160 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="18" y="26" width="90" height="62" rx="10" transform="rotate(-8 18 26)" fill="var(--surface-container-highest)" stroke="var(--outline-variant)" stroke-width="1.5"/>
            <rect x="30" y="20" width="90" height="62" rx="10" transform="rotate(4 30 20)" fill="var(--surface-lowest)" stroke="var(--outline-variant)" stroke-width="1.5"/>
            <rect x="38" y="24" width="86" height="58" rx="10" fill="var(--primary-container)"/>
            <text x="81" y="61" text-anchor="middle" font-family="Manrope, sans-serif" font-size="30" font-weight="800" fill="var(--on-primary-container)">A+B</text>
            <circle cx="128" cy="30" r="9" fill="var(--tertiary-container, var(--secondary-container))"/>
            <path d="M124 30l3 3 6-6" stroke="var(--on-tertiary-container, var(--on-secondary-container))" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="game-card-body">
          <h3 data-en="Flashcards" data-ar="بطاقات تعليمية"></h3>
          <p data-en="Turn any topic into a quick deck of question-and-answer cards, and quiz yourself until it sticks." data-ar="حوّل أي موضوع إلى مجموعة بطاقات سؤال وجواب سريعة، واختبر نفسك حتى تثبت المعلومة."></p>
          <button type="button" class="btn btn-primary btn-sm game-card-cta" data-en="Open" data-ar="فتح"></button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ======================================================================
     FLASHCARD EDITOR — add a card to a subject/folder, or jump straight
     into a study session for whichever subject/folder is picked.
     ====================================================================== -->
<div class="modal-backdrop" id="flashcardModalBackdrop" onclick="if(event.target===this) closeFlashcardModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 data-en="Flashcards" data-ar="بطاقات تعليمية"></h2>
      <button class="btn-icon" onclick="closeFlashcardModal()" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="fcSubject" data-en="Subject" data-ar="المادة"></label>
        <select id="fcSubject" onchange="handleSubjectSelectChange()">
          <option value="__new__" data-en="+ New subject" data-ar="+ إنشاء مادة جديدة"></option>
        </select>
        <input type="text" id="fcNewSubject" class="hidden" data-en-placeholder="e.g. Biology" data-ar-placeholder="مثال: أحياء" placeholder="e.g. Biology" style="margin-top:8px;">
      </div>
      <div class="field">
        <label for="fcFolder" data-en="Folder" data-ar="المجلد"></label>
        <select id="fcFolder" onchange="handleFolderSelectChange()" disabled>
          <option value="__new__" data-en="+ New folder" data-ar="+ إنشاء مجلد جديد"></option>
        </select>
        <input type="text" id="fcNewFolder" class="hidden" data-en-placeholder="e.g. Chapter 1" data-ar-placeholder="مثال: الفصل الأول" placeholder="e.g. Chapter 1" style="margin-top:8px;">
        <span class="hint" id="fcCardsCountHint"></span>
      </div>
      <div class="field">
        <label for="fcTerm" data-en="Term / word (front of the card)" data-ar="المصطلح أو الكلمة (وجه البطاقة)"></label>
        <input type="text" id="fcTerm" data-en-placeholder="e.g. Photosynthesis" data-ar-placeholder="مثال: التمثيل الضوئي" placeholder="e.g. Photosynthesis">
      </div>
      <div class="field">
        <label for="fcDefinition" data-en="Definition / translation (back of the card)" data-ar="التعريف أو الترجمة (ظهر البطاقة)"></label>
        <textarea id="fcDefinition" rows="3" data-en-placeholder="e.g. The process plants use to turn light into energy" data-ar-placeholder="مثال: العملية التي تحوّل بها النباتات الضوء إلى طاقة" placeholder="e.g. The process plants use to turn light into energy"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="handleDoneClick()" data-en="Done" data-ar="تم"></button>
      <button class="btn btn-primary" onclick="handleStartPlayingClick()" data-en="Start playing" data-ar="ابدأ اللعب"></button>
    </div>
  </div>
</div>

<!-- ======================================================================
     STUDY SESSION — the actual flashcard "game" screen. Kept visually
     dark/focused regardless of the site's light/dark theme, the same way
     the video player modal always plays on a black background.
     ====================================================================== -->
<div class="modal-backdrop study-modal-backdrop" id="studyModalBackdrop" onclick="if(event.target===this) closeStudyModal()">
  <div class="study-wrap" onclick="event.stopPropagation()">
    <div class="study-card">
      <div class="study-card-top">
        <div class="study-menu-wrap">
          <button type="button" class="study-menu-btn" onclick="toggleStudyMenu(event)" aria-label="Menu">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
          </button>
          <div class="study-menu hidden" id="studyMenu">
            <button type="button" onclick="endStudySession()" data-en="End session" data-ar="إنهاء الجلسة"></button>
          </div>
        </div>
        <span class="study-counter" id="studyCounter">1 / 1</span>
      </div>

      <div class="study-question-view" id="studyQuestionView">
        <div class="study-term-wrap">
          <p class="study-term" id="studyTerm"></p>
          <p class="study-definition hidden" id="studyDefinition"></p>
        </div>
        <button type="button" class="study-reveal-btn" id="studyRevealBtn" onclick="revealAnswer()" data-en="Show answer" data-ar="عرض الإجابة"></button>
      </div>

      <div class="study-results-view hidden" id="studyResultsView">
        <h2 data-en="Session complete" data-ar="انتهت الجلسة"></h2>
        <p class="study-results-summary">
          <span data-en="Correct" data-ar="صحيح"></span>: <span id="resultCorrect">0</span>
          &nbsp;·&nbsp;
          <span data-en="Wrong" data-ar="خطأ"></span>: <span id="resultWrong">0</span>
        </p>
        <div class="study-results-actions">
          <button type="button" class="btn btn-outline" onclick="restartSession()" data-en="Play again" data-ar="إعادة اللعب"></button>
          <button type="button" class="btn btn-primary" onclick="closeStudyModal()" data-en="Close" data-ar="إغلاق"></button>
        </div>
      </div>
    </div>

    <div class="study-controls" id="studyControls">
      <button type="button" class="study-ctrl-btn study-ctrl-nav" onclick="prevCard()" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <button type="button" class="study-ctrl-btn study-ctrl-correct" id="correctBtn" onclick="markCorrect()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="correctCount">0</span>
      </button>
      <button type="button" class="study-ctrl-btn study-ctrl-wrong" id="wrongBtn" onclick="markWrong()" disabled>
        <span id="wrongCount">0</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <button type="button" class="study-ctrl-btn study-ctrl-nav" onclick="nextCard()" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- shared.js first (Firebase init, i18n, theme, toast) — games.js depends on it.
     flashcards.js is its own module (see the comment in games.js) so the
     route-guard file stays small while the flashcards feature grows. -->
<script type="module" src="shared.js"></script>
<script type="module" src="games.js"></script>
<script type="module" src="flashcards.js"></script>

</body>
</html>
