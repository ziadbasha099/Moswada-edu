<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Moswada</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="moswada-logo.png">
<link rel="stylesheet" href="downloads-admin.css">
</head>
<body data-theme="light">

<div class="admin-shell">

  <!-- ============== LOGIN ============== -->
  <div id="loginView">
    <div class="admin-card">
      <h1 id="loginTitle">Admin sign in</h1>
      <p class="sub" id="loginSub">Sign in with the admin account to manage download links.</p>
      <div class="admin-error hidden" id="loginError"></div>
      <form id="loginForm">
        <div class="admin-field">
          <label id="emailLabel" for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="admin-field">
          <label id="passLabel" for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="admin-btn" id="loginBtn">Sign in</button>
      </form>
    </div>
  </div>

  <!-- ============== DASHBOARD ============== -->
  <div id="dashView" class="hidden">
    <div class="admin-toprow">
      <h1 id="dashTitle" style="font-size:20px;margin:0;">Manage downloads</h1>
      <button class="admin-btn secondary small" id="logoutBtn">Sign out</button>
    </div>

    <div class="admin-card">
      <h1 id="addTitle" style="font-size:17px;">Add a download</h1>
      <p class="sub" id="addSub">Give it a title and paste the MediaFire link — it appears on the downloads page instantly.</p>
      <div class="admin-error hidden" id="addError"></div>
      <form id="addForm">
        <div class="admin-field">
          <label id="fileTitleLabel" for="fileTitle">File title</label>
          <input type="text" id="fileTitle" placeholder="e.g. Project Template Pack" required>
        </div>
        <div class="admin-field">
          <label id="folderLabel" for="folderSelect">Folder</label>
          <select id="folderSelect">
            <option value="__new__" id="newFolderOption">+ New folder</option>
          </select>
          <input type="text" id="newFolderInput" placeholder="e.g. Templates" style="margin-top:8px;">
        </div>
        <div class="admin-field">
          <label id="iconLabel">Icon</label>
          <div class="icon-picker" id="iconPicker">
            <button type="button" class="icon-opt" data-icon="file" title="File">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
            </button>
            <button type="button" class="icon-opt" data-icon="link" title="Link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.07 0l2.83-2.83a5 5 0 10-7.07-7.07L11.5 4.5"/><path d="M14 11a5 5 0 00-7.07 0L4.1 13.83a5 5 0 107.07 7.07l1.4-1.4"/></svg>
            </button>
            <button type="button" class="icon-opt" data-icon="mindmap" title="Mind map">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.2 7l7.6 3.8M8.2 17l7.6-3.8"/></svg>
            </button>
          </div>
        </div>
        <div class="admin-field">
          <label id="colorLabel">Color</label>
          <div class="color-picker" id="colorPicker">
            <button type="button" class="color-opt color-swatch-green" data-color="green" title="Green"></button>
            <button type="button" class="color-opt color-swatch-blue" data-color="blue" title="Blue"></button>
            <button type="button" class="color-opt color-swatch-yellow" data-color="yellow" title="Yellow"></button>
          </div>
        </div>
        <div class="admin-field">
          <label id="urlLabel" for="fileUrl">MediaFire link</label>
          <input type="url" id="fileUrl" placeholder="https://www.mediafire.com/file/..." required>
          <p class="admin-hint" id="urlHint">Only MediaFire links are accepted.</p>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="admin-btn" id="addBtn">Add download</button>
          <button type="button" class="admin-btn secondary small hidden" id="cancelEditBtn">Cancel</button>
        </div>
      </form>
    </div>

    <div class="admin-list" id="list"></div>
  </div>

</div>

<div class="admin-toast" id="toast"></div>

<script type="module" 
src="admin.js"></script>
</body>
</html>
