<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Moswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@500;600;700&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="moswada-logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="moswada logo home.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

<!-- ======================================================================
     SETTINGS PAGE — only reachable by a signed-in user. settings.js's
     route guard sends anyone without a session back to index.html and
     reveals this section once Firebase confirms who's signed in, so it
     starts hidden to avoid a flash of empty UI before that check runs.
     ====================================================================== -->
<div id="settingsPage" class="hidden">

  <div class="topbar settings-topbar">
    <a class="logo settings-logo" href="app.html">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="var(--primary)"/>
          <path d="M10 8h12a1 1 0 011 1v15l-7-4-7 4V9a1 1 0 011-1z" fill="var(--on-primary)"/>
        </svg>
      </span>
      <span>Moswada</span>
    </a>
    <div class="topbar-actions">
      <button id="lang-btn" aria-label="Switch language">
        <svg class="lang-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>
        </svg>
        <span class="lang-btn-label">العربية</span>
      </button>
      <a class="btn btn-ghost settings-back-btn" href="app.html" data-en="Back to your links" data-ar="العودة إلى روابطك"></a>
    </div>
  </div>

  <div class="settings-shell container">
    <div class="settings-heading">
      <h1 data-en="Settings" data-ar="الإعدادات"></h1>
      <p data-en="Manage your account, appearance, and support." data-ar="أدر حسابك ومظهر التطبيق والدعم."></p>
    </div>

    <!-- ============== PROFILE ============== -->
    <section class="settings-card">
      <div class="settings-card-head">
        <span class="settings-icon">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </span>
        <div>
          <h2 data-en="Profile" data-ar="الملف الشخصي"></h2>
          <p data-en="Your name and the email you sign in with." data-ar="اسمك والبريد الإلكتروني الذي تسجّل به الدخول."></p>
        </div>
      </div>
      <div class="settings-field-row">
        <div class="field">
          <label for="stName" data-en="Full name" data-ar="الاسم الكامل"></label>
          <input type="text" id="stName" data-en-placeholder="Your name" data-ar-placeholder="اسمك" placeholder="Your name">
        </div>
        <div class="field">
          <label for="stEmail" data-en="Email address" data-ar="البريد الإلكتروني"></label>
          <input type="email" id="stEmail" disabled>
          <span class="hint" data-en="Contact us to change the email on your account." data-ar="راسلنا لتغيير البريد الإلكتروني الخاص بحسابك."></span>
        </div>
      </div>
      <button class="btn btn-primary settings-save-btn" id="saveProfileBtn" data-en="Update profile" data-ar="تحديث الملف الشخصي"></button>
    </section>

    <!-- ============== APPEARANCE ============== -->
    <section class="settings-card">
      <div class="settings-card-head">
        <span class="settings-icon">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
        <div>
          <h2 data-en="Appearance" data-ar="المظهر"></h2>
          <p data-en="Choose how Moswada looks on this device." data-ar="اختر شكل مسودة على هذا الجهاز."></p>
        </div>
      </div>
      <div class="theme-options" id="themeOptions">
        <button type="button" class="theme-option" data-theme-choice="light">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span data-en="Light" data-ar="فاتح"></span>
        </button>
        <button type="button" class="theme-option" data-theme-choice="dark">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
          <span data-en="Dark" data-ar="داكن"></span>
        </button>
        <button type="button" class="theme-option" data-theme-choice="system">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span data-en="System" data-ar="النظام"></span>
        </button>
      </div>
    </section>

    <!-- ============== LANGUAGE ============== -->
    <section class="settings-card">
      <div class="settings-card-head">
        <span class="settings-icon">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
        </span>
        <div>
          <h2 data-en="Language" data-ar="اللغة"></h2>
          <p data-en="Choose the language used across Moswada." data-ar="اختر اللغة المستخدمة في مسودة."></p>
        </div>
      </div>
      <div class="theme-options settings-two-col" id="langOptions">
        <button type="button" class="theme-option" data-lang-choice="en">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
          <span>English</span>
        </button>
        <button type="button" class="theme-option" data-lang-choice="ar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
          <span>العربية</span>
        </button>
      </div>
    </section>

    <!-- ============== CONTACT ============== -->
    <section class="settings-card">
      <div class="settings-card-head">
        <span class="settings-icon">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </span>
        <div>
          <h2 data-en="Contact us" data-ar="تواصل معنا"></h2>
          <p data-en="Questions, feedback, or an issue with your account? We read every message." data-ar="أسئلة أو ملاحظات أو مشكلة في حسابك؟ نقرأ كل رسالة."></p>
        </div>
      </div>
      <a class="btn btn-outline" href="mailto:moswadasupport@gmail.com" data-en="Email support" data-ar="راسلنا عبر البريد"></a>
    </section>

    <!-- ============== SESSION ============== -->
    <section class="settings-card">
      <div class="settings-row">
        <div>
          <p class="settings-row-title" data-en="Sign out" data-ar="تسجيل الخروج"></p>
          <p class="settings-row-sub" data-en="You'll need to sign in again on this device." data-ar="ستحتاج لتسجيل الدخول مرة أخرى على هذا الجهاز."></p>
        </div>
        <button class="btn btn-outline" id="signOutBtn" data-en="Sign out" data-ar="تسجيل الخروج"></button>
      </div>
    </section>

    <!-- ============== DANGER ZONE ============== -->
    <section class="settings-card settings-danger">
      <div class="settings-row">
        <div>
          <p class="settings-row-title" data-en="Delete account" data-ar="حذف الحساب"></p>
          <p class="settings-row-sub" data-en="Permanently deletes your account, folders, and links. This cannot be undone." data-ar="سيؤدي هذا إلى حذف حسابك ومجلداتك وروابطك نهائياً. لا يمكن التراجع عن هذا الإجراء."></p>
        </div>
        <button class="btn settings-delete-btn" id="deleteAccountBtn" data-en="Delete account" data-ar="حذف الحساب"></button>
      </div>
    </section>
  </div>
</div>

<!-- ======================================================================
     DELETE ACCOUNT — CONFIRMATION MODAL
     ====================================================================== -->
<div class="modal-backdrop" id="deleteModalBackdrop" onclick="if(event.target===this) closeDeleteModal()">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <h2 data-en="Delete your account?" data-ar="حذف حسابك؟"></h2>
      <button class="btn-icon" onclick="closeDeleteModal()" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p data-en="This permanently deletes your folders, links, notes, and tags. This cannot be undone." data-ar="سيؤدي هذا إلى حذف مجلداتك وروابطك وملاحظاتك ووسومك نهائياً. لا يمكن التراجع عن هذا الإجراء."></p>
      <div class="admin-error hidden" id="deleteError"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeDeleteModal()" data-en="Cancel" data-ar="إلغاء"></button>
      <button class="btn settings-delete-btn" id="confirmDeleteBtn" data-en="Yes, delete everything" data-ar="نعم، احذف كل شيء"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- shared.js first (Firebase init, i18n, theme, toast) — settings.js depends on it -->
<script type="module" src="shared.js"></script>
<script type="module" src="settings.js"></script>

</body>
</html>
