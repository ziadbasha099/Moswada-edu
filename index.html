  <section class="section showcase" id="showcase">
    <div class="container showcase-inner">
      <div class="showcase-copy">
        <span class="eyebrow"><span class="dot"></span><span data-en="Your dashboard" data-ar="لوحتك الخاصة"></span></span>
        <h2 data-en="One calm view of everything you've saved" 
        data-ar="عرض هادئ واحد لكل ما حفظته"></h2>
        <p data-en="A single sidebar for folders, a clean grid for links, and a search bar that actually finds things. No ads, no algorithmic feed." data-ar="شريط جانبي واحد للمجلدات، وشبكة واضحة للروابط، وشريط بحث يجد ما تريده فعلاً. بلا إعلانات، وبلا خلاصة تعتمد على خوارزميات."></p>

  <section class="section">
    <div class="cta-band">
      <h2 data-en="Give your links a calmer home" data-ar="امنح روابطك بيتاً أكثر هدوءاً"></h2>
      <p data-en="Free to start. Your first folder is one click away." data-ar="مجاني للبدء. مجلدك الأول على بُعد نقرة واحدة."></p>
      <button class="btn btn-primary" onclick="showAuth('signup')" data-en="Get started free" data-ar="رتب فيديوهاتك"></button>
    </div>
  </section>

  <footer class="landing-footer" id="footer">
    <div class="container">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">

    </div>

<!-- ======================================================================
     AUTH PAGE — Email sign-in / sign-up
     ====================================================================== -->
<div id="auth" class="auth-page hidden">
  <div class="auth-topbar">
    <div class="container">
      <div class="logo" onclick="backToLanding()">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="8" fill="var(--primary)"/>
            <path d="M10 8h12a1 1 0 011 1v15l-7-4-7 4V9a1 1 0 011-1z" fill="var(--on-primary)"/>
          </svg>
        </span>
        <span>Moswada</span>
      </div>
      <button class="btn btn-ghost" onclick="backToLanding()" data-en="Back to home" data-ar="العودة للرئيسية"></button>
    </div>
  </div>

  <div class="auth-shell">
    <div class="auth-card">
      <h1 id="authTitle">Welcome back</h1>
      <p class="auth-sub" id="authSub">Sign in to pick up where you left off.</p>

      <div class="auth-error hidden" id="authError" role="alert"></div>

      <form class="auth-form" id="authForm" onsubmit="handleAuthSubmit(event)" novalidate>
        <div class="field hidden" id="authNameField">
          <label for="authName" data-en="Name" data-ar="الاسم"></label>
          <input id="authName" name="name" type="text" autocomplete="name">
        </div>

        <div class="field">
          <label for="authEmail" data-en="Email" data-ar="البريد الإلكتروني"></label>
          <input id="authEmail" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="authPassword" data-en="Password" data-ar="كلمة المرور"></label>
          <input id="authPassword" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary" id="authSubmitBtn">Sign In</button>
      </form>

      <div class="auth-divider" data-en="or" data-ar="أو"></div>

      <button type="button" class="auth-google-btn" onclick="handleGoogleSignIn()">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.54 5.54 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.1A11.99 11.99 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28v-3.1H1.26A11.99 11.99 0 0 0 0 12c0 1.94.46 3.77 1.26 5.38l4.01-3.1z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.26 6.62l4.01 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
        <span data-en="Continue with Google" data-ar="المتابعة عبر جوجل"></span>
      </button>

      <p class="auth-switch" id="authSwitch">
        Don't have an account? <button type="button" onclick="switchAuthMode('signup')">Sign up</button>
      </p>
      <p class="auth-note" data-en="By continuing you agree to keep your links, notes, and tags private to your account." data-ar="بالمتابعة، أنت توافق على إبقاء روابطك وملاحظاتك ووسومك خاصة بحسابك."></p>
    </div>
  </div>
</div>
