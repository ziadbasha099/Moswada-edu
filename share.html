<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared folder — Moswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@500;600;700&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="moswada logo home.jpg">
<link rel="apple-touch-icon" sizes="180x180" href="moswada logo home.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

<header class="topbar" style="position:sticky; top:0;">
  <a class="logo" href="index.html" style="margin-inline-end:auto;">
    <span class="logo-mark" aria-hidden="true"><img src="moswada-logo.png" alt="Moswada logo"></span>
  </a>
  <div class="topbar-actions">
    <button id="lang-btn" aria-label="Switch language">
      <svg class="lang-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>
      </svg>
      <span class="lang-btn-label">العربية</span>
    </button>
    <a class="btn btn-outline btn-sm" href="index.html" data-en="Home" data-ar="الرئيسية"></a>
  </div>
</header>

<div class="container" style="padding-top:32px; padding-bottom:64px;">
  <div class="section-head" style="text-align:start; margin:0 0 32px; max-width:none; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;">
    <div>
      <span class="eyebrow"><span class="dot"></span><span data-en="Shared folder" data-ar="مجلد مُشارَك"></span></span>
      <h2 id="shareTitle">…</h2>
      <p data-en="Videos shared with you. Play them here, or add any of them to your own account." data-ar="فيديوهات تمت مشاركتها معك. شغّلها هنا، أو أضف أياً منها إلى حسابك."></p>
    </div>
    <!-- Bulk import — hidden until we know there's more than one video
         to add (see updateAddAllVisibility() in share.js) -->
    <button class="btn btn-primary hidden" id="addAllBtn" onclick="addAllToMyList()" style="flex-shrink:0;">
      <svg class="icon" style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span data-en="Add all to my videos" data-ar="أضف الكل إلى فيديوهاتي"></span>
    </button>
  </div>

  <div class="link-grid" id="shareGrid"></div>

  <div class="empty-state" id="shareLoading">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
    <h3 data-en="Loading…" data-ar="جارٍ التحميل…"></h3>
  </div>
  <div class="empty-state hidden" id="shareEmpty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
    <h3 data-en="Nothing here yet" data-ar="لا يوجد شيء هنا بعد"></h3>
    <p data-en="This folder has no videos yet." data-ar="لا يوجد فيديوهات في هذا المجلد بعد."></p>
  </div>
  <div class="empty-state hidden" id="shareNotFound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>
    <h3 data-en="Link not found" data-ar="الرابط غير موجود"></h3>
    <p data-en="This share link is invalid or was removed by its owner." data-ar="رابط المشاركة غير صالح أو تمت إزالته من صاحبه."></p>
  </div>
</div>

<!-- ======================================================================
     VIDEO PLAYER MODAL — read-only playback (no notes/tags/timestamps,
     those stay private to whoever owns the original link)
     ====================================================================== -->
<div class="modal-backdrop" id="playerModalBackdrop" onclick="if(event.target===this) closePlayerModal()">
  <div class="modal player-modal">
    <div class="player-video-container" id="playerVideoContainer">
      <div class="player-wrap" id="playerWrap"></div>
      <button type="button" class="player-zoom-btn" id="playerZoomBtn" onclick="toggleVideoZoom()" data-en-title="Fullscreen" data-ar-title="ملء الشاشة" title="Fullscreen" aria-label="Toggle fullscreen">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/>
        </svg>
      </button>
    </div>
    <div class="player-info">
      <h2 id="playerTitle">Video</h2>
      <p class="card-domain" id="playerDomain"></p>
      <button class="btn btn-primary" id="playerAddBtn" style="margin-top:16px; width:100%;" data-en="Add to my videos" data-ar="أضف إلى فيديوهاتي"></button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closePlayerModal()" data-en="Close" data-ar="إغلاق"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="shared.js"></script>
<script type="module" src="share.js"></script>

</body>
</html>
