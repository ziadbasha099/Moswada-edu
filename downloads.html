<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloads — Moswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="../photos/moswada-logo.png">
<link rel="stylesheet" href="../CSS/downloads-admin.css">
<style>
  /* Logo enlarged after removing the "Moswada" text label */
  .dl-brand-logo-only img{
    height: 44px;
    width: auto;
  }
</style>
</head>
<body data-theme="light">

<div class="dl-topbar container">
  <a class="dl-brand dl-brand-logo-only" href="index.html">
    <img src="../photos/moswada-logo.png" alt="Moswada logo">
  </a>
  <div class="dl-topbar-actions">
    <button class="lang-toggle" id="langBtn">العربية</button>
    <a class="dl-back" id="backLink" href="index.html">Back to home</a>
  </div>
</div>

<div class="dl-hero container">
  <h1 id="pageTitle">Downloads</h1>
  <p id="pageSub">Browse ready-made files, organized into folders. Search by name or pick a folder to narrow things down.</p>

  <div class="dl-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="Search files...">
  </div>

  <div class="dl-chips" id="folderChips"></div>
</div>

<div class="container">
  <div class="dl-grid" id="grid"></div>

  <div class="dl-state hidden" id="loadingState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
    <h3 id="loadingTitle">Loading files…</h3>
  </div>

  <div class="dl-state hidden" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
    <h3 id="emptyTitle">Nothing here yet</h3>
    <p id="emptyMsg">No files match your search right now.</p>
  </div>
</div>

<div class="admin-toast" id="toast"></div>

<script type="module" 
src="../JavaScript/downloads.js"></script>
</body>
</html>
